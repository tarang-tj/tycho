name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Syntax lint and the unit tests. The headless boot probe (npm run verify:boot)
      # asserts real signal-delay timing and is too timing-sensitive for a shared
      # software-rendered runner, so it stays a local gate: run `npm run gate` before a push.
      - run: npm run lint
      - run: npm run test:unit
